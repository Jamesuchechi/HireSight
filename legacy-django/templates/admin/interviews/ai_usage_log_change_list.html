{% extends "admin/change_list.html" %}

{% block content %}
  <div class="module align-wide">
    <h2>AI usage totals</h2>
    <div style="display:flex; gap:2rem;">
      <div>
        <p style="margin:0; font-weight:bold;">Tokens</p>
        <p style="font-size:1.25rem; margin:0;">
          {{ aggregate_totals.total_tokens|default:"0" }}
        </p>
      </div>
      <div>
        <p style="margin:0; font-weight:bold;">Estimated cost</p>
        <p style="font-size:1.25rem; margin:0; color:#10b981;">
          ${{ aggregate_totals.total_cost|default:"0.00" }}
        </p>
      </div>
    </div>
  </div>
  {{ block.super }}
{% endblock %}
