<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject %}HireSight Interview{% endblock %}</title>
    <style>
        body {
            background-color: #f5f5f7;
            color: #111827;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }
        .email-card {
            max-width: 620px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.15);
        }
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            font-weight: 600;
            border-radius: 999px;
            text-decoration: none;
            margin-top: 16px;
        }
        .meta {
            font-size: 14px;
            color: #6b7280;
        }
        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 24px 0;
        }
    </style>
</head>
<body>
<div class="email-card">
    <div class="meta">HireSight · Interviews</div>
    <h1 style="margin: 12px 0; font-size: 28px; color: #111827;">{% block heading %}Interview Update{% endblock %}</h1>
    <p class="meta" style="margin-top: 0;">{{ company.company_name if company else 'HireSight' }}</p>
    <div class="divider"></div>
    {% block content %}
    <p>This is a generic interview update.</p>
    {% endblock %}
    <div class="divider"></div>
    <p class="meta" style="margin-bottom:0;">Need help? Reply to this email or visit your HireSight dashboard.</p>
</div>
</body>
</html>
