<!-- Screening Questions Manager Component -->
{% load static %}

<style>
.screening-questions-container {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    padding: 1.5rem;
}

.questions-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1rem;
}

.question-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    transition: all 0.2s ease;
}

.question-item:hover {
    background: #f3f4f6;
    border-color: #d1d5db;
}

.question-number {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: #e0e7ff;
    color: #4f46e5;
    border-radius: 50%;
    font-weight: 600;
    font-size: 0.875rem;
    flex-shrink: 0;
}

.question-content {
    flex: 1;
    min-width: 0;
}

.question-text {
    font-size: 0.9375rem;
    color: #1f2937;
    margin-bottom: 0.5rem;
    word-wrap: break-word;
}

.question-type {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 500;
    color: #6b7280;
    background: white;
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
    border: 1px solid #d1d5db;
}

.question-actions {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
}

.btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    background: white;
    color: #6b7280;
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.2s ease;
}

.btn-icon:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
    color: #374151;
}

.btn-icon.delete:hover {
    background: #fef2f2;
    border-color: #fca5a5;
    color: #dc2626;
}

.add-question-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e5e7eb;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-weight: 500;
    color: #374151;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
}

.form-group input,
.form-group textarea,
.form-group select {
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    font-family: inherit;
    font-size: 0.9375rem;
    transition: all 0.2s ease;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 80px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.button-group {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
}

.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 0.375rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.9375rem;
}

.btn-primary {
    background: #4f46e5;
    color: white;
}

.btn-primary:hover {
    background: #4338ca;
}

.btn-secondary {
    background: #e5e7eb;
    color: #374151;
}

.btn-secondary:hover {
    background: #d1d5db;
}

.empty-state {
    text-align: center;
    padding: 2rem;
    color: #6b7280;
}

.empty-state-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

.question-type-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 0.25rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: capitalize;
}

.badge-short-text {
    background: #dbeafe;
    color: #1e40af;
}

.badge-long-text {
    background: #e0e7ff;
    color: #3730a3;
}

.badge-multiple-choice {
    background: #dcfce7;
    color: #15803d;
}

.badge-yes-no {
    background: #fef3c7;
    color: #92400e;
}

@media (max-width: 640px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .question-item {
        flex-direction: column;
    }
    
    .question-actions {
        width: 100%;
    }
}
</style>

<div class="screening-questions-container" id="screening-questions-container">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Screening Questions (Optional)</h3>
        <span class="text-sm text-gray-600">
            <span id="question-count">0</span> questions
        </span>
    </div>
    
    <!-- Hidden textarea to store JSON -->
    <textarea id="screening-questions-json" name="screening_questions" style="display: none;">{{ form.screening_questions.value|default:"[]" }}</textarea>
    
    <!-- Questions List -->
    <div class="questions-list" id="questions-list">
        <div class="empty-state" id="empty-state">
            <div class="empty-state-icon">📋</div>
            <p>No screening questions yet</p>
            <p class="text-sm mt-1">Add questions to filter and qualify applicants</p>
        </div>
    </div>
    
    <!-- Add Question Form -->
    <div class="add-question-form">
        <h4 class="font-semibold text-gray-800 text-sm">Add Screening Question</h4>
        
        <div class="form-group">
            <label>Question Text *</label>
            <textarea id="question-text" placeholder="e.g., What is your experience with Django?"></textarea>
        </div>
        
        <div class="form-group">
            <label>Question Type *</label>
            <select id="question-type">
                <option value="">Select type...</option>
                <option value="short-text">Short Text (1 line)</option>
                <option value="long-text">Long Text (paragraph)</option>
                <option value="yes-no">Yes/No</option>
                <option value="multiple-choice">Multiple Choice</option>
            </select>
        </div>
        
        <div id="multiple-choice-options" class="form-group" style="display: none;">
            <label>Options (comma-separated)</label>
            <input type="text" id="question-options" placeholder="Option 1, Option 2, Option 3">
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" id="question-required"> Make this question required
            </label>
        </div>
        
        <div class="button-group">
            <button type="button" class="btn btn-secondary" id="clear-form-btn">Clear</button>
            <button type="button" class="btn btn-primary" id="add-question-btn">Add Question</button>
        </div>
    </div>
</div>

<script>
/**
 * Screening Questions Manager
 * Handles adding, editing, and removing screening questions
 */
class ScreeningQuestionsManager {
    constructor(containerId = 'screening-questions-container') {
        this.container = document.getElementById(containerId);
        this.questionsList = document.getElementById('questions-list');
        this.jsonField = document.getElementById('screening-questions-json');
        this.questions = this.loadQuestions();
        
        this.setupEventListeners();
        this.renderQuestions();
    }
    
    setupEventListeners() {
        // Type change
        document.getElementById('question-type').addEventListener('change', (e) => {
            const optionsDiv = document.getElementById('multiple-choice-options');
            optionsDiv.style.display = e.target.value === 'multiple-choice' ? 'block' : 'none';
        });
        
        // Add button
        document.getElementById('add-question-btn').addEventListener('click', () => {
            this.addQuestion();
        });
        
        // Clear button
        document.getElementById('clear-form-btn').addEventListener('click', () => {
            this.clearForm();
        });
        
        // Enter key to add (when not in textarea)
        document.getElementById('question-type').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.addQuestion();
        });
    }
    
    loadQuestions() {
        const data = this.jsonField.value;
        try {
            return data ? JSON.parse(data) : [];
        } catch (e) {
            return [];
        }
    }
    
    saveQuestions() {
        this.jsonField.value = JSON.stringify(this.questions);
    }
    
    addQuestion() {
        const text = document.getElementById('question-text').value.trim();
        const type = document.getElementById('question-type').value;
        const required = document.getElementById('question-required').checked;
        
        if (!text || !type) {
            alert('Please fill in question text and select a type');
            return;
        }
        
        const question = {
            id: Date.now().toString(),
            text: text,
            type: type,
            required: required,
            options: []
        };
        
        if (type === 'multiple-choice') {
            const optionsStr = document.getElementById('question-options').value.trim();
            if (!optionsStr) {
                alert('Please enter options for multiple choice question');
                return;
            }
            question.options = optionsStr.split(',').map(o => o.trim()).filter(o => o);
        }
        
        this.questions.push(question);
        this.saveQuestions();
        this.renderQuestions();
        this.clearForm();
    }
    
    deleteQuestion(id) {
        this.questions = this.questions.filter(q => q.id !== id);
        this.saveQuestions();
        this.renderQuestions();
    }
    
    moveQuestion(id, direction) {
        const index = this.questions.findIndex(q => q.id === id);
        if (index === -1) return;
        
        if (direction === 'up' && index > 0) {
            [this.questions[index], this.questions[index - 1]] = 
            [this.questions[index - 1], this.questions[index]];
        } else if (direction === 'down' && index < this.questions.length - 1) {
            [this.questions[index], this.questions[index + 1]] = 
            [this.questions[index + 1], this.questions[index]];
        }
        
        this.saveQuestions();
        this.renderQuestions();
    }
    
    clearForm() {
        document.getElementById('question-text').value = '';
        document.getElementById('question-type').value = '';
        document.getElementById('question-options').value = '';
        document.getElementById('question-required').checked = false;
        document.getElementById('multiple-choice-options').style.display = 'none';
        document.getElementById('question-text').focus();
    }
    
    getTypeBadgeClass(type) {
        const classes = {
            'short-text': 'badge-short-text',
            'long-text': 'badge-long-text',
            'multiple-choice': 'badge-multiple-choice',
            'yes-no': 'badge-yes-no'
        };
        return classes[type] || '';
    }
    
    getTypeLabel(type) {
        const labels = {
            'short-text': 'Short Text',
            'long-text': 'Long Text',
            'multiple-choice': 'Multiple Choice',
            'yes-no': 'Yes/No'
        };
        return labels[type] || type;
    }
    
    renderQuestions() {
        document.getElementById('question-count').textContent = this.questions.length;
        
        if (this.questions.length === 0) {
            this.questionsList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>No screening questions yet</p>
                    <p class="text-sm mt-1">Add questions to filter and qualify applicants</p>
                </div>
            `;
            return;
        }
        
        this.questionsList.innerHTML = this.questions.map((q, index) => `
            <div class="question-item" data-question-id="${q.id}">
                <div class="question-number">${index + 1}</div>
                <div class="question-content">
                    <div class="question-text">${this.escapeHtml(q.text)}</div>
                    <div class="flex gap-2 items-center">
                        <span class="question-type-badge ${this.getTypeBadgeClass(q.type)}">
                            ${this.getTypeLabel(q.type)}
                        </span>
                        ${q.required ? '<span class="text-xs text-red-600 font-semibold">Required</span>' : ''}
                        ${q.options.length > 0 ? `<span class="text-xs text-gray-600">${q.options.length} options</span>` : ''}
                    </div>
                </div>
                <div class="question-actions">
                    ${index > 0 ? `<button type="button" class="btn-icon move-up" data-id="${q.id}" title="Move up">▲</button>` : ''}
                    ${index < this.questions.length - 1 ? `<button type="button" class="btn-icon move-down" data-id="${q.id}" title="Move down">▼</button>` : ''}
                    <button type="button" class="btn-icon delete" data-id="${q.id}" title="Delete">✕</button>
                </div>
            </div>
        `).join('');
        
        // Add event listeners to action buttons
        this.questionsList.querySelectorAll('.move-up').forEach(btn => {
            btn.addEventListener('click', () => {
                this.moveQuestion(btn.dataset.id, 'up');
            });
        });
        
        this.questionsList.querySelectorAll('.move-down').forEach(btn => {
            btn.addEventListener('click', () => {
                this.moveQuestion(btn.dataset.id, 'down');
            });
        });
        
        this.questionsList.querySelectorAll('.delete').forEach(btn => {
            btn.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete this question?')) {
                    this.deleteQuestion(btn.dataset.id);
                }
            });
        });
    }
    
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('screening-questions-container')) {
        window.screeningQuestionsManager = new ScreeningQuestionsManager();
    }
});
</script>
