<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #2563eb; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
        .content { background: #f9fafb; padding: 30px; border-radius: 0 0 8px 8px; }
        .button { display: inline-block; background: #2563eb; color: white; 
                  padding: 12px 24px; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Message on HireSight</h1>
        </div>
        <div class="content">
            <p>Hi {{ recipient.email }},</p>
            <p>You have received a new message from <strong>{{ sender_name }}</strong>:</p>
            <p style="background: white; padding: 15px; border-left: 4px solid #2563eb;">
                {{ message_preview }}
            </p>
            <p>
                <a href="{{ conversation_url }}" class="button">View Message</a>
            </p>
            <p style="color: #6b7280; font-size: 14px;">
                This is an automated notification from HireSight. 
                You can manage your notification preferences in your account settings.
            </p>
        </div>
    </div>
</body>
</html>
