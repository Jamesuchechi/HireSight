{% extends "admin/base_site.html" %}

{% block content %}
  <div class="module">
    <h1>{{ title }}</h1>
    <p>
      Displaying the last 30 days of practice sessions (
      {{ window_start }} - {{ window_end }}).
    </p>
    <p>
      Total sessions: <strong>{{ total_sessions }}</strong> ·
      Average score: <strong>{{ average_score }}</strong>
    </p>
  </div>

  <div class="module align-wide">
    <canvas id="practiceChart" height="140"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.0.1/dist/chart.umd.min.js"></script>
  <script>
    const ctx = document.getElementById('practiceChart');
    if (ctx) {
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: {{ chart_labels|safe }},
          datasets: [
            {
              label: 'Sessions',
              data: {{ chart_sessions|safe }},
              borderColor: '#0ea5e9',
              backgroundColor: 'rgba(14, 165, 233, 0.2)',
              tension: 0.3,
              yAxisID: 'y'
            },
            {
              label: 'Average Score',
              data: {{ chart_scores|safe }},
              borderColor: '#f97316',
              backgroundColor: 'rgba(249, 115, 22, 0.2)',
              tension: 0.3,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              position: 'left',
              title: {
                display: true,
                text: 'Sessions'
              }
            },
            y1: {
              beginAtZero: true,
              position: 'right',
              grid: {
                drawOnChartArea: false
              },
              title: {
                display: true,
                text: 'Average Score'
              }
            }
          }
        }
      });
    }
  </script>
{% endblock %}
