{% comment %}Reusable back button that prefers HTTP referer with fallback.{% endcomment %}
{% with referer=request.META.HTTP_REFERER fallback=fallback_url|default:'/' %}
    {% with href=referer|default:fallback %}
        <div class="mb-6">
            <a href="{{ href }}"
               class="inline-flex items-center text-sm font-semibold text-gray-700 hover:text-primary transition-colors rounded-lg px-3 py-2 border border-gray-200 bg-white">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>{{ label|default:"Back" }}</span>
            </a>
        </div>
    {% endwith %}
{% endwith %}
