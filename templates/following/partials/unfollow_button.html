<form method="post" action="{% url 'following:toggle' target_id %}" class="inline-flex">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url|default:request.path }}">
    <button type="submit"
            class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 border border-gray-300 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        {{ label|default:"Unfollow" }}
    </button>
</form>
