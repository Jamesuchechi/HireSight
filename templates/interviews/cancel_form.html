{% extends 'base.html' %}

{% block title %}Cancel Interview{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Cancel Interview</h1>
    <form method="post" class="space-y-4 bg-white shadow rounded-lg p-6">
        {% csrf_token %}
        {{ form.reason.label_tag }}
        {{ form.reason }}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">Confirm Cancel</button>
    </form>
</div>
{% endblock %}
