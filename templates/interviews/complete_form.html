{% extends 'base.html' %}

{% block title %}Mark Interview Complete{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Mark Interview Completed</h1>
    <form method="post" class="space-y-4 bg-white shadow rounded-lg p-6">
        {% csrf_token %}
        <label class="font-semibold">Completion Notes</label>
        <textarea name="completion_notes" rows="4" class="form-textarea w-full"></textarea>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Mark Completed</button>
    </form>
</div>
{% endblock %}
