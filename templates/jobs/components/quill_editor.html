<!-- templates/jobs/components/quill_editor.html -->
{% load static %}

<!-- Quill Stylesheet -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

<style>
/* Custom Quill Styling for Job Descriptions */
#quill-description-editor,
#quill-responsibilities-editor,
#quill-nice-to-have-editor {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 0.75rem;
    min-height: 200px;
    width: 100%;
    box-sizing: border-box;
}

#quill-description-editor .ql-container,
#quill-responsibilities-editor .ql-container,
#quill-nice-to-have-editor .ql-container {
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 150px;
    border: none;
}

#quill-description-editor .ql-editor,
#quill-responsibilities-editor .ql-editor,
#quill-nice-to-have-editor .ql-editor {
    min-height: 150px;
    padding: 1rem;
}

#quill-description-editor.ql-container.ql-snow,
#quill-responsibilities-editor.ql-container.ql-snow,
#quill-nice-to-have-editor.ql-container.ql-snow {
    border: 1px solid #d1d5db;
}

#quill-description-editor .ql-toolbar,
#quill-responsibilities-editor .ql-toolbar,
#quill-nice-to-have-editor .ql-toolbar {
    border: none;
    border-bottom: 1px solid #e5e7eb;
    border-radius: 0.75rem 0.75rem 0 0;
    background: #f9fafb;
    padding: 0.75rem 1rem;
}

.ql-toolbar.ql-snow {
    border: none !important;
    border-bottom: 1px solid #e5e7eb !important;
}

.ql-container.ql-snow {
    border: none !important;
}

.quill-error {
    border-color: #ef4444 !important;
}
</style>

<!-- Quill Editor Script -->
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>

<script>
    (function() {
        const initQuillEditors = function() {
            console.log('Initializing Quill editors...');

            function setupEditor(editorSelector, textareaId, placeholder, options = {}) {
                const editorElement = document.querySelector(editorSelector);
                const textarea = document.getElementById(textareaId);

                if (!editorElement || !textarea) {
                    console.warn(`Quill editor skipped: ${editorSelector}`);
                    return null;
                }

                if (typeof Quill === 'undefined') {
                    showTextareaFallback(editorElement, textarea);
                    return null;
                }

                const quillInstance = new Quill(editorSelector, {
                    theme: 'snow',
                    modules: {
                        toolbar: [
                            [{ 'header': [2, 3, false] }],
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                            [{ 'indent': '-1' }, { 'indent': '+1' }],
                            ['link'],
                            ['clean']
                        ],
                        ...(options.modules || {})
                    },
                    placeholder,
                    readOnly: options.readOnly || false
                });

                if (textarea.value) {
                    quillInstance.root.innerHTML = textarea.value;
                }

                quillInstance.on('text-change', function() {
                    textarea.value = quillInstance.root.innerHTML;
                });

                return quillInstance;
            }

function showTextareaFallback(editorElement, textarea) {
                if (editorElement) {
                    editorElement.style.display = 'none';
                }
                if (textarea) {
                    textarea.style.display = 'block';
                    textarea.style.minHeight = '150px';
                    textarea.style.width = '100%';
                    textarea.style.boxSizing = 'border-box';
                }
            }

            const descriptionQuill = setupEditor(
                '#quill-description-editor',
                'quill-description',
                'Describe the role in detail. What will the candidate be doing day-to-day? What projects will they work on?'
            );

            if (descriptionQuill) {
                const textarea = document.getElementById('quill-description');
                const editorElement = document.querySelector('#quill-description-editor');
                const form = textarea.closest('form');
                if (form) {
                    form.addEventListener('submit', function(event) {
                        const text = descriptionQuill.getText().trim();
                        if (text.length < 100) {
                            event.preventDefault();
                            alert('Job description must be at least 100 characters long');
                            if (editorElement) {
                                editorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    });
                }
            }

            setupEditor(
                '#quill-responsibilities-editor',
                'quill-responsibilities',
                'List the key responsibilities and duties for this role...'
            );

            setupEditor(
                '#quill-nice-to-have-editor',
                'quill-nice-to-have',
                'What additional skills or experience would be beneficial but not required?'
            );
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initQuillEditors);
        } else {
            initQuillEditors();
        }
    })();
</script>
